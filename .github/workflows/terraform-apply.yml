name: terraform-apply

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-apply-dev
  cancel-in-progress: false

jobs:
  apply-dev:
    runs-on: ubuntu-latest
    environment: dev
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC, apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_APPLY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        run: terraform init -backend-config=envs/dev/backend.hcl

      - name: Terraform plan
        run: terraform plan -input=false -no-color -var-file=envs/dev/dev.tfvars -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan